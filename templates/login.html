{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Budget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-title">Budget</div>

            {{if .Error}}
            <div class="login-error">{{.Error}}</div>
            {{end}}

            {{if .PasswordEnabled}}
            <form method="POST" action="/login">
                <input type="hidden" name="next" value="{{.Next}}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login">Sign in</button>
            </form>
            {{end}}

            {{if and .PasswordEnabled .OIDCEnabled}}
            <div class="or-divider">or</div>
            {{end}}

            {{if .OIDCEnabled}}
            <a href="/login/oidc?next={{.Next}}" class="btn-sso">Sign in with SSO</a>

            <p class="text-xs text-muted text-center mt-6">
                Pocket ID redirect URI:<br><code>{{.OIDCRedirectURL}}</code>
            </p>
            {{end}}
        </div>
    </div>
</body>
</html>
{{end}}
