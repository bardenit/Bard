<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}Budget</title>
    <link rel="stylesheet" href="/static/style.css?v={{.Version}}">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Budget">
    <link rel="apple-touch-icon" href="/static/icon-180.png">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <div class="nav-brand">
                Budget <span style="font-size: 0.6em; color: var(--text-muted); font-weight: normal;">v{{.Version}}</span>
                {{if .LatestVersion}}<a href="https://github.com/bardenit/Bard" target="_blank" rel="noopener" style="font-size: 0.6em; font-weight: normal; color: #856404; text-decoration: none; margin-left: 0.25em;">&#x2192; {{.LatestVersion}}</a>{{end}}
            </div>
            <div class="nav-links">
                <a href="/" {{if eq .ActiveNav "dashboard"}}class="active"{{end}}>Dashboard</a>
                <a href="/calendar" {{if eq .ActiveNav "calendar"}}class="active"{{end}}>Calendar</a>
            </div>
            <div class="nav-dropdown nav-dropdown-right">
                <span class="nav-dropdown-toggle {{if or (eq .ActiveNav "bills") (eq .ActiveNav "income") (eq .ActiveNav "budgets") (eq .ActiveNav "expenditures") (eq .ActiveNav "transactions") (eq .ActiveNav "backup")}}active{{end}}">Options &#x25BE;</span>
                <div class="nav-dropdown-menu">
                    <a href="/bills" {{if eq .ActiveNav "bills"}}class="active"{{end}}>Bills</a>
                    <a href="/income" {{if eq .ActiveNav "income"}}class="active"{{end}}>Income</a>
                    <a href="/budgets" {{if eq .ActiveNav "budgets"}}class="active"{{end}}>Budgets</a>
                    <a href="/expenditures" {{if eq .ActiveNav "expenditures"}}class="active"{{end}}>Expenditures</a>
                    <a href="/transactions" {{if eq .ActiveNav "transactions"}}class="active"{{end}}>Transactions</a>
                    <a href="/backup" {{if eq .ActiveNav "backup"}}class="active"{{end}}>Backup &amp; Restore</a>
                </div>
            </div>
        </div>
    </nav>
    {{if .Flash}}
    <div class="flash">{{.Flash}}</div>
    {{end}}
    <main class="container">
        {{template "content" .}}
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
