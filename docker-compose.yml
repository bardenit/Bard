services:
  budget:
    image: jbarden75/budget:latest
    container_name: budget
    ports:
      - "8080:8080"
    volumes:
      - budget-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: budget-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - budget

volumes:
  budget-data:
    name: budget-data   # reuses your existing volume — no data loss
  caddy-data:
  caddy-config:
